<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือระบบรับฝากเงิน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body {font-family:'Prompt',sans-serif;margin:0;background:#eef5ff;}
header {background:linear-gradient(90deg,#1e90ff,#00c6ff);color:#fff;text-align:center;padding:25px;}
.tabs {display:flex;justify-content:center;margin:20px;gap:10px;}
.tab-btn {padding:10px 20px;border:none;border-radius:25px;cursor:pointer;background:#ddd;}
.tab-btn.active {background:#1e90ff;color:#fff;}
.container {max-width:1100px;margin:auto;padding:20px;}
.section {background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 5px 15px rgba(0,0,0,0.05);} 
.img-wrapper {margin-top:10px;cursor:pointer;}
.img-wrapper img {width:100%;border-radius:10px;}
.modal {display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;}
.modal img {max-width:90%;max-height:90%;}
</style>
</head>
<body>
<header><h1>📘 คู่มือระบบรับฝากเงิน</h1></header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('deposit')">ระบบรับฝากเงิน</button>
  <button class="tab-btn" onclick="showTab('dashboard')">Dashboard</button>
</div>

<div id="deposit" class="container">
  <div class="section"><h2>1. Login</h2><div class="img-wrapper"><img src="deposit/1.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>2. กรอกข้อมูล</h2><div class="img-wrapper"><img src="deposit/2.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>3. ดึงข้อมูลอัตโนมัติ</h2><div class="img-wrapper"><img src="deposit/3.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>4. ยืนยันข้อมูล</h2><div class="img-wrapper"><img src="deposit/4.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>5. ดาวน์โหลด PDF</h2><div class="img-wrapper"><img src="deposit/5.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>6. ตัวอย่าง PDF</h2><div class="img-wrapper"><img src="deposit/6.png" onclick="openModal(this)"></div></div>
</div>

<div id="dashboard" class="container" style="display:none;">
  <div class="section"><h2>1. Login</h2><div class="img-wrapper"><img src="dashboard/1.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>2. รายการผู้ใช้งาน</h2><div class="img-wrapper"><img src="dashboard/2.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>3. รายละเอียดรายการ</h2><div class="img-wrapper"><img src="dashboard/3.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>4. รายการทั้งหมด</h2><div class="img-wrapper"><img src="dashboard/4.png" onclick="openModal(this)"></div></div>
  <div class="section"><h2>5. Filter & Export</h2><div class="img-wrapper"><img src="dashboard/5.png" onclick="openModal(this)"></div></div>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'"><img id="modalImg"></div>

<script>
function showTab(tab){
  document.getElementById('deposit').style.display = tab==='deposit'?'block':'none';
  document.getElementById('dashboard').style.display = tab==='dashboard'?'block':'none';
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.remove('active'));
  event.target.classList.add('active');
}
function openModal(img){
  document.getElementById('modal').style.display='flex';
  document.getElementById('modalImg').src=img.src;
}
</script>

</body>
</html>
